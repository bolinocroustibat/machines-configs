- name: Update ZSH
  block:
    - name: Update ZSH with homebrew
      when: ansible_facts["os_family"] == "Darwin"
      homebrew:
        name: zsh
        state: latest
        update_homebrew: true

    - name: Update ZSH with apt
      when: ansible_facts["os_family"] == "Debian"
      apt:
        name: zsh
        state: latest
        update_cache: true
      become: true

# On macOS, update plugins system-wide via Homebrew
- name: Update ZSH plugins with Homebrew
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      - zsh-syntax-highlighting
    state: latest
    update_homebrew: true

- name: Update IRIS with Homebrew
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: versenilvis/iris/iris
    state: latest
    update_homebrew: true

- name: Update IRIS on Debian
  when: ansible_facts["os_family"] == "Debian"
  block:
    - name: Download IRIS install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/versenilvis/iris/main/scripts/install.sh"
        dest: "/tmp/iris_install.sh"
        mode: u=rwx,g=rx,o=rx

    - name: Update IRIS system-wide
      environment:
        BIN_DIR: /usr/local/bin
      ansible.builtin.command: "sh /tmp/iris_install.sh"
      become: true
      register: zsh_iris_update_result
      changed_when: "'Installation verified' in zsh_iris_update_result.stdout"

    - name: Delete IRIS install script
      ansible.builtin.file:
        path: "/tmp/iris_install.sh"
        state: absent

# Per-user configuration: plugins (Debian), .zshrc, and shell change
- name: Configure ZSH for users
  include_tasks: configure_user.yaml
  loop: "{{ shell_users_list }}"
  loop_control:
    loop_var: user_config
