# System-level ZSH installation, then per-user configuration.

- name: Install ZSH
  block:
    - name: Install ZSH with homebrew
      when: ansible_facts["os_family"] == "Darwin"
      homebrew:
        name: zsh
        state: present

    - name: Install ZSH with apt
      when: ansible_facts["os_family"] == "Debian"
      apt:
        name: zsh
        state: present
        update_cache: true
      become: true

- name: Install git (required for ZSH plugins)
  when: ansible_facts["os_family"] == "Debian"
  apt:
    name: git
    state: present
    update_cache: true
  become: true

# On macOS, plugins are installed system-wide via Homebrew
- name: Install ZSH plugins with Homebrew
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name:
      # - zsh-autosuggestions # Replaced by IRIS
      - zsh-syntax-highlighting
    state: present

- name: Install IRIS with Homebrew
  when: ansible_facts["os_family"] == "Darwin"
  community.general.homebrew:
    name: versenilvis/iris/iris
    state: present

- name: Install IRIS on Debian
  when: ansible_facts["os_family"] == "Debian"
  block:
    - name: Download IRIS install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/versenilvis/iris/main/scripts/install.sh"
        dest: "/tmp/iris_install.sh"
        mode: u=rwx,g=rx,o=rx

    - name: Install IRIS system-wide
      environment:
        BIN_DIR: /usr/local/bin
      ansible.builtin.command: "sh /tmp/iris_install.sh"
      become: true
      register: zsh_iris_install_result
      changed_when: "'Installation verified' in zsh_iris_install_result.stdout"

    - name: Delete IRIS install script
      ansible.builtin.file:
        path: "/tmp/iris_install.sh"
        state: absent

# Per-user configuration: plugins (Debian), .zshrc, and shell change
- name: Configure ZSH for users
  include_tasks: configure_user.yaml
  loop: "{{ shell_users_list }}"
  loop_control:
    loop_var: user_config
